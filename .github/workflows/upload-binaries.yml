name: Upload Binaries to S3

on:
  workflow_dispatch:
  schedule:
    # Run daily at 2 AM UTC to check for new versions
    - cron: '0 2 * * *'
  push:
    tags:
      - 'v*'

jobs:
  upload-binaries:
    name: Upload kubectl and Helm to S3
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Check kubectl version on S3
        id: check-kubectl
        run: |
          ARCH=${{ matrix.arch }}
          KUBECTL_RELEASE=$(curl -L -s https://dl.k8s.io/release/stable.txt)
          KUBECTL_VERSION="${KUBECTL_RELEASE#v}"  # Remove 'v' prefix if present
          
          # Check if version exists on S3
          S3_VERSION=$(aws s3 cp s3://doazgpt-public/tools/kubectl/${ARCH}/version.txt - 2>/dev/null | tr -d '\n' || echo "")
          S3_KEY="tools/kubectl/${ARCH}/kubectl-${KUBECTL_VERSION}"
          
          if [ -n "${S3_VERSION}" ] && [ "${S3_VERSION}" = "${KUBECTL_VERSION}" ] && aws s3 ls "s3://doazgpt-public/${S3_KEY}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "version=${KUBECTL_VERSION}" >> $GITHUB_OUTPUT
            echo "⏭️  kubectl ${KUBECTL_VERSION} already exists on S3"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "version=${KUBECTL_VERSION}" >> $GITHUB_OUTPUT
            echo "📥 Need to download kubectl ${KUBECTL_VERSION}"
          fi
      
      - name: Download kubectl
        if: steps.check-kubectl.outputs.exists == 'false'
        id: kubectl
        run: |
          ARCH=${{ matrix.arch }}
          KUBECTL_VERSION="${{ steps.check-kubectl.outputs.version }}"
          KUBECTL_RELEASE=$(curl -L -s https://dl.k8s.io/release/stable.txt)
          KUBECTL_URL="https://dl.k8s.io/release/${KUBECTL_RELEASE}/bin/linux/${ARCH}/kubectl"
          
          curl -f -s -L -o kubectl "${KUBECTL_URL}"
          chmod +x kubectl
          
          # Try to extract actual version from kubectl output
          if ./kubectl version --client >/dev/null 2>&1; then
            ACTUAL_VERSION=$(./kubectl version --client --short 2>/dev/null | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "${KUBECTL_VERSION}")
            if [ -n "${ACTUAL_VERSION}" ]; then
              KUBECTL_VERSION="${ACTUAL_VERSION}"
            fi
          fi
          
          echo "version=${KUBECTL_VERSION}" >> $GITHUB_OUTPUT
          echo "✅ kubectl ${KUBECTL_VERSION} downloaded"
      
      - name: Upload kubectl to S3
        if: steps.check-kubectl.outputs.exists == 'false'
        run: |
          ARCH=${{ matrix.arch }}
          VERSION="${{ steps.kubectl.outputs.version }}"
          S3_BUCKET="doazgpt-public"
          
          # Upload version-specific
          aws s3 cp kubectl "s3://${S3_BUCKET}/tools/kubectl/${ARCH}/kubectl-${VERSION}" \
            --acl public-read \
            --content-type application/octet-stream \
            --metadata "version=${VERSION}"
          
          # Upload latest
          aws s3 cp kubectl "s3://${S3_BUCKET}/tools/kubectl/${ARCH}/kubectl-latest" \
            --acl public-read \
            --content-type application/octet-stream \
            --metadata "version=${VERSION}"
          
          # Upload version file
          echo "${VERSION}" | aws s3 cp - "s3://${S3_BUCKET}/tools/kubectl/${ARCH}/version.txt" \
            --acl public-read \
            --content-type text/plain
          
          echo "✅ kubectl uploaded: https://${S3_BUCKET}.s3.amazonaws.com/tools/kubectl/${ARCH}/kubectl-latest"
      
      - name: Check Helm version on S3
        id: check-helm
        run: |
          ARCH=${{ matrix.arch }}
          case "${ARCH}" in
            amd64) HELM_ARCH="amd64" ;;
            arm64) HELM_ARCH="arm64" ;;
            *) HELM_ARCH="amd64" ;;
          esac
          
          HELM_VERSION=$(curl -s https://api.github.com/repos/helm/helm/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' | head -1)
          if [ -z "$HELM_VERSION" ]; then
            HELM_VERSION="v3.20.0"
          fi
          
          # Check if version exists on S3
          S3_VERSION=$(aws s3 cp s3://doazgpt-public/tools/helm/${HELM_ARCH}/version.txt - 2>/dev/null | tr -d '\n' || echo "")
          S3_KEY="tools/helm/${HELM_ARCH}/helm-${HELM_VERSION}"
          
          if [ -n "${S3_VERSION}" ] && [ "${S3_VERSION}" = "${HELM_VERSION}" ] && aws s3 ls "s3://doazgpt-public/${S3_KEY}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "version=${HELM_VERSION}" >> $GITHUB_OUTPUT
            echo "arch=${HELM_ARCH}" >> $GITHUB_OUTPUT
            echo "⏭️  Helm ${HELM_VERSION} already exists on S3"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "version=${HELM_VERSION}" >> $GITHUB_OUTPUT
            echo "arch=${HELM_ARCH}" >> $GITHUB_OUTPUT
            echo "📥 Need to download Helm ${HELM_VERSION}"
          fi
      
      - name: Download Helm
        if: steps.check-helm.outputs.exists == 'false'
        id: helm
        run: |
          HELM_VERSION="${{ steps.check-helm.outputs.version }}"
          HELM_ARCH="${{ steps.check-helm.outputs.arch }}"
          HELM_URL="https://get.helm.sh/helm-${HELM_VERSION}-linux-${HELM_ARCH}.tar.gz"
          
          curl -f -s -L -o helm.tar.gz "${HELM_URL}"
          tar -xzf helm.tar.gz "linux-${HELM_ARCH}/helm"
          mv "linux-${HELM_ARCH}/helm" helm
          chmod +x helm
          rm -rf helm.tar.gz "linux-${HELM_ARCH}"
          
          echo "version=${HELM_VERSION}" >> $GITHUB_OUTPUT
          echo "arch=${HELM_ARCH}" >> $GITHUB_OUTPUT
          echo "✅ Helm ${HELM_VERSION} downloaded"
      
      - name: Upload Helm to S3
        if: steps.check-helm.outputs.exists == 'false'
        run: |
          ARCH="${{ steps.helm.outputs.arch }}"
          VERSION="${{ steps.helm.outputs.version }}"
          S3_BUCKET="doazgpt-public"
          
          # Upload version-specific
          aws s3 cp helm "s3://${S3_BUCKET}/tools/helm/${ARCH}/helm-${VERSION}" \
            --acl public-read \
            --content-type application/octet-stream \
            --metadata "version=${VERSION}"
          
          # Upload latest
          aws s3 cp helm "s3://${S3_BUCKET}/tools/helm/${ARCH}/helm-latest" \
            --acl public-read \
            --content-type application/octet-stream \
            --metadata "version=${VERSION}"
          
          # Upload version file
          echo "${VERSION}" | aws s3 cp - "s3://${S3_BUCKET}/tools/helm/${ARCH}/version.txt" \
            --acl public-read \
            --content-type text/plain
          
          echo "✅ Helm uploaded: https://${S3_BUCKET}.s3.amazonaws.com/tools/helm/${ARCH}/helm-latest"
      
      - name: Summary
        run: |
          echo "## 📦 Binary Upload Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture:** ${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### kubectl" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-kubectl.outputs.exists }}" = "true" ]; then
            echo "- Version: ${{ steps.check-kubectl.outputs.version }} (already on S3, skipped)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Version: ${{ steps.kubectl.outputs.version }} (uploaded)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- URL: https://doazgpt-public.s3.amazonaws.com/tools/kubectl/${{ matrix.arch }}/kubectl-latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Helm" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-helm.outputs.exists }}" = "true" ]; then
            echo "- Version: ${{ steps.check-helm.outputs.version }} (already on S3, skipped)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Version: ${{ steps.helm.outputs.version }} (uploaded)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- URL: https://doazgpt-public.s3.amazonaws.com/tools/helm/${{ steps.check-helm.outputs.arch }}/helm-latest" >> $GITHUB_STEP_SUMMARY
